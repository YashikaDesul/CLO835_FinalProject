<!DOCTYPE html>
<html>
<head>
    <title>Add Emp Output</title>
    <style>
        body {
            background-image: url('{{ background_image }}');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            font-family: avenir, sans-serif;
            color: DodgerBlue;
            text-align: center;
            padding-top: 100px;
        }

        .content {
            background-color: rgba(255, 255, 255, 0.85);
            margin: auto;
            width: 60%;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.3);
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #000;
        }
    </style>
</head>
<body>

    <h1>{{ group_name }} - {{ group_slogan }}</h1>
    <p>Welcome to our app!</p>

    <div class="content">
        <h1>The employee {{ name }} was successfully added to the database</h1>
        <h2>The Employee has been added to the database</h2>
        <h2>{{ name }}</h2>
        <a href="{{ url_for('home') }}">Back</a>
    </div>
</body>
</html>
