name: Build, Push Image to ECR for CLO Project 

on:
  push:
    branches: [ dev ]

jobs:
  build:
    name: Automated Deployment to AWS ECR
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      S3_BUCKET: my-clo835-backgrounds
      ECR_APP_REPOSITORY: clo835-app
      ECR_DB_REPOSITORY: clo835-mysql
      IMAGE_TAG: latest
      DOCKER_NETWORK: clo835-network

    steps:
    - name: GIT | Check out code
      uses: actions/checkout@v4

    - name: AWS | ECR Login
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: DOCKER | Build
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        echo Build Database
        docker build -t $ECR_REGISTRY/$ECR_DB_REPOSITORY:$IMAGE_TAG -f Dockerfile.mysql .

        echo Build Application
        docker build -t $ECR_REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG -f Dockerfile .

    - name: DOCKER | Run and Test
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # Create network
        echo Create Bridge Network
        docker network create -d bridge --subnet 192.168.100.0/24 --gateway 192.168.100.1 $DOCKER_NETWORK

        # Spawn containers
        echo Run Database
        DBCONID=$(docker run -d \
          -e MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
          -e MYSQL_USER=${{ secrets.MYSQL_USER }} \
          -e MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
          -e MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }} \
          --network "${DOCKER_NETWORK}" \
          --name db_container \
          $ECR_REGISTRY/$ECR_DB_REPOSITORY:$IMAGE_TAG)

        # Get DB IP Address
        DBHOST=$(docker inspect -f '{{.NetworkSettings.Networks.clo835-network.IPAddress}}' $DBCONID)

        # Wait for MySQL to be ready
        echo "Waiting for MySQL to be ready..."
        for i in {1..30}; do
          if docker exec db_container mysql -u${{ secrets.MYSQL_USER }} -p${{ secrets.MYSQL_PASSWORD }} ${{ secrets.MYSQL_DATABASE }} -e "SELECT 1" >/dev/null 2>&1; then
            echo "MySQL is ready"
            break
          fi
          echo "Still waiting..."
          sleep 2
        done

        # Run application container
        echo Run Application
        docker run -d -p 81:81 \
          -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
          -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
          -e S3_BUCKET=$S3_BUCKET \
          -e MYSQL_USER=${{ secrets.MYSQL_USER }} \
          -e MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
          -e MYSQL_HOST=$DBHOST \
          -e MYSQL_DB=${{ secrets.MYSQL_DATABASE }} \
          -e BACKGROUND_IMAGE_URL=background.jpg \
          -e GROUP_NAME=Group-13 \
          -e GROUP_SLOGAN="Scaling the Future" \
          --network "${DOCKER_NETWORK}" \
          --name app_container \
          $ECR_REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG

        # Unit test
        docker ps
        echo "Pause for 10 seconds to let container start"
        sleep 10

        # Test root endpoint
        if curl -s http://localhost:81 -o /dev/null -w "%{http_code}" | grep 200; then
          echo "Root endpoint test passed: HTTP 200"
        else
          echo "Root endpoint test failed"
          exit 1
        fi

        # Test /getemp endpoint
        if curl -s http://localhost:81/getemp -o /dev/null -w "%{http_code}" | grep 200; then
          echo "/getemp endpoint test passed: HTTP 200"
        else
          echo "/getemp endpoint test failed"
          exit 1
        fi

        # Test S3 image download by checking logs
        if docker logs app_container | grep "Downloaded background image from s3://my-clo835-backgrounds/background.jpg"; then
          echo "S3 image download test passed"
        else
          echo "S3 image download test failed: Download log not found"
          exit 1
        fi

    - name: DOCKER | Push
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker push $ECR_REGISTRY/$ECR_DB_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_APP_REPOSITORY:$IMAGE_TAG

    - name: Clean up
      if: always()
      run: |
        docker stop app_container db_container || true
        docker rm app_container db_container || true
        docker network rm $DOCKER_NETWORK || true
